syntax = "proto3";

package search;

option go_package = "shop.me/backend/pb";

// Represents a product to be indexed
message ProductData {
    uint32 id = 1;
    string title = 2;
    string description = 3;
}

// Request to index multiple products for a shop
message IndexRequest {
    string shop_id = 1;
    repeated ProductData products = 2;
}

// Response from indexing
message IndexResponse {
    bool success = 1;
    int32 indexed_count = 2;
}

// Request to search for products
message SearchRequest {
    string shop_id = 1;
    string query = 2;
    int32 top_k = 3;
}

// Represents a matching product result
message SearchResult {
    uint32 product_id = 1;
    float score = 2;
}

// Response from searching
message SearchResponse {
    repeated SearchResult results = 1;
}

// The Semantic Search Service
service SemanticSearchService {
    rpc IndexProducts(IndexRequest) returns (IndexResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
}
